# Drop-in for docker.service: at boot, start Docker only after the storage roots are mounted.
# Wants, not Requires: a disk that disappears later must not stop Docker and every app with it.
# Needs systemd 256 or newer. Install as /etc/systemd/system/docker.service.d/mediaharbor.conf
# with your APPDATA_ROOT and DATA_ROOT from config/host.env.
[Unit]
WantsMountsFor=/srv/mediaharbor/appdata /srv/mediaharbor/data
