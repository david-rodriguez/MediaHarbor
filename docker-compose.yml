name: mediaharbor

x-common: &common
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-lsio-env: &lsio-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-America/New_York}
  UMASK: "002"

# Each app answers its own health URL. When it stops answering, Docker marks it unhealthy and harbor heal restarts it.
x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 60s

services:
  gluetun:
    <<: *common
    image: qmcgaw/gluetun:latest@sha256:3c43ec327d7ab2b5f1dc798b92a7640de9a1e1b74a81c9a5143adb383c03d28b
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      TZ: ${TZ:-America/New_York}
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY_SECRETFILE: /run/secrets/wireguard_private_key
      SERVER_COUNTRIES: ${PROTON_COUNTRIES:-Netherlands}
      PORT_FORWARD_ONLY: "on"
      VPN_PORT_FORWARDING: "on"
      VPN_PORT_FORWARDING_STATUS_FILE: /forwarded/port
      VPN_PORT_FORWARDING_DOWN_COMMAND: /bin/sh -c 'rm -f /forwarded/port'
      FIREWALL_INPUT_PORTS: "8080"
      HEALTH_SERVER_ADDRESS: 127.0.0.1:9999
    secrets: [wireguard_private_key]
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT}/gluetun:/gluetun
      - forwarded:/forwarded
      - ${HARBOR_ROOT:-.}/config/gluetun/post-rules.txt:/iptables/post-rules.txt:ro
    ports: [127.0.0.1:8080:8080]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    # Keep the image's built-in VPN healthcheck and firewall defaults.

  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:latest@sha256:3d4c4545d51a690a0df15a2ff99038823a88a9822df8e794526447b9afbd7384
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      <<: *lsio-env
      WEBUI_PORT: "8080"
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT}/qbittorrent:/config
      - ${DATA_ROOT:?Set DATA_ROOT}:/data
    healthcheck:
      <<: *healthcheck
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:8080/]

  port-sync:
    <<: *common
    image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
      qbittorrent:
        condition: service_started
    user: ${PUID:-1000}:${PGID:-1000}
    cap_drop: [ALL]
    read_only: true
    command: [python, -B, /app/port_sync.py]
    volumes:
      # Long syntax: Compose splits the short tmpfs form at commas.
      - type: tmpfs
        target: /tmp
        tmpfs: {size: 1m, mode: 01777}
      - ${HARBOR_ROOT:-.}/scripts/port_sync.py:/app/port_sync.py:ro
      - forwarded:/forwarded:ro
    secrets: [qbit_username, qbit_password]
    healthcheck:
      <<: *healthcheck
      test: [CMD, python, -c, "import pathlib,time; p=pathlib.Path('/tmp/sync-health'); exit(0 if p.exists() and time.time()-p.stat().st_mtime < 120 else 1)"]

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest@sha256:339814bbf50599ac3b59077c252f29833d0138b59a062d0e82ce37bdc7f04f86
    environment: *lsio-env
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT}/sonarr:/config
      - ${DATA_ROOT:?Set DATA_ROOT}:/data
    ports: [127.0.0.1:8989:8989]
    healthcheck:
      <<: *healthcheck
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:8989/ping]

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest@sha256:044788f5508b7f67a3e0368cdd142c77c4d4cd5aec2efaba53e1a68b6b6231e7
    environment: *lsio-env
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT}/radarr:/config
      - ${DATA_ROOT:?Set DATA_ROOT}:/data
    ports: [127.0.0.1:7878:7878]
    healthcheck:
      <<: *healthcheck
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:7878/ping]

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:latest@sha256:2806c9b763810589c42157730d547c293639e55c7610e9f5069314854639ec48
    environment: *lsio-env
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT}/prowlarr:/config
    ports: [127.0.0.1:9696:9696]
    healthcheck:
      <<: *healthcheck
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:9696/ping]

  bazarr:
    <<: *common
    image: lscr.io/linuxserver/bazarr:latest@sha256:e0c5d45965242830c5eeddaafe9ae2b5e8ca3f6c01ecda9ee9364f550921dc50
    environment: *lsio-env
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT}/bazarr:/config
      - ${DATA_ROOT:?Set DATA_ROOT}/media:/data/media
    ports: [127.0.0.1:6767:6767]
    healthcheck:
      <<: *healthcheck
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:6767/ping]

  seerr:
    <<: *common
    image: ghcr.io/seerr-team/seerr:latest@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
    init: true
    environment:
      TZ: ${TZ:-America/New_York}
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT}/seerr:/app/config
    ports: [127.0.0.1:5055:5055]
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://127.0.0.1:5055/api/v1/settings/public]

  plex:
    <<: *common
    image: lscr.io/linuxserver/plex:latest@sha256:9a1325bf0b34a50993a04be0bdcc7fab841d2a78161bd11b4db4ff8478a7ac2a
    environment:
      <<: *lsio-env
      VERSION: docker
      # One-time claim token from https://plex.tv/claim; ignored after the server is claimed.
      FILE__PLEX_CLAIM: /run/secrets/plex_claim
    secrets: [plex_claim]
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT}/plex:/config
      - ${DATA_ROOT:?Set DATA_ROOT}/media:/data/media:ro
    # The only port published beyond loopback: Plex authenticates every client itself.
    ports: ["32400:32400"]
    healthcheck:
      <<: *healthcheck
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:32400/identity]
      # Database migrations after an upgrade can take minutes.
      start_period: 5m

  jellyfin:
    <<: *common
    image: lscr.io/linuxserver/jellyfin:latest@sha256:b10044530553b2506f06279bf0b5223f9534f434f87a277da4b8fa8ac386cb58
    profiles: [jellyfin]
    environment: *lsio-env
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT}/jellyfin:/config
      - ${DATA_ROOT:?Set DATA_ROOT}/media:/data/media:ro
    ports: [127.0.0.1:8096:8096]
    healthcheck:
      <<: *healthcheck
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:8096/health]

  lidarr:
    <<: *common
    image: lscr.io/linuxserver/lidarr:latest@sha256:8fb40ada166dd1880cb1b166df5bcbb081107523f20ab60df05c313e2052a467
    profiles: [lidarr]
    environment: *lsio-env
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT}/lidarr:/config
      - ${DATA_ROOT:?Set DATA_ROOT}:/data
    ports: [127.0.0.1:8686:8686]
    healthcheck:
      <<: *healthcheck
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:8686/ping]

  sabnzbd:
    <<: *common
    image: lscr.io/linuxserver/sabnzbd:latest@sha256:d225bbab93f54784c115a3b1d89711e469b1969c9f32aa6ebb11fb03b5804431
    profiles: [sabnzbd]
    environment: *lsio-env
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT}/sabnzbd:/config
      - ${DATA_ROOT:?Set DATA_ROOT}:/data
    ports: [127.0.0.1:8081:8080]
    healthcheck:
      <<: *healthcheck
      test: [CMD, curl, -fsS, -o, /dev/null, "http://127.0.0.1:8080/api?mode=version"]

  bookshelf:
    <<: *common
    # Readarr revival; the hardcover tag uses Hardcover metadata.
    image: ghcr.io/pennydreadful/bookshelf:hardcover@sha256:67498dd5ece516867d72ee642abd6c1a66b36a135c8f7da0127109564372beb1
    profiles: [bookshelf]
    environment: *lsio-env
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT}/bookshelf:/config
      - ${DATA_ROOT:?Set DATA_ROOT}:/data
    ports: [127.0.0.1:8787:8787]
    healthcheck:
      <<: *healthcheck
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:8787/ping]

  audiobookshelf:
    <<: *common
    image: ghcr.io/advplyr/audiobookshelf:latest@sha256:60064c23f32fd9099fd39e82c5132c51701d1221135bbca04cd099b589e1edc3
    profiles: [audiobookshelf]
    user: ${PUID:-1000}:${PGID:-1000}
    environment:
      TZ: ${TZ:-America/New_York}
      # Non-root processes cannot bind the image's default port 80.
      PORT: "13378"
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT}/audiobookshelf:/config
      - ${APPDATA_ROOT:?Set APPDATA_ROOT}/audiobookshelf-metadata:/metadata
      - ${DATA_ROOT:?Set DATA_ROOT}/media/audiobooks:/audiobooks:ro
    ports: [127.0.0.1:13378:13378]
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, --spider, http://127.0.0.1:13378/healthcheck]

  homepage:
    <<: *common
    image: ghcr.io/gethomepage/homepage:latest@sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18
    profiles: [homepage]
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-localhost:3000}
      HOMEPAGE_VAR_BASE_URL: ${HOMEPAGE_VAR_BASE_URL:-https://mediaharbor.example-tailnet.ts.net}
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT}/homepage:/app/config
    ports: [127.0.0.1:3000:3000]
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, --spider, http://127.0.0.1:3000/api/healthcheck]

  tautulli:
    <<: *common
    image: lscr.io/linuxserver/tautulli:latest@sha256:5e8f80cc18f03c606a3567c8a9b37d80812ed8017d2e2f8ff2e2a91b54a3aef1
    profiles: [tautulli]
    environment: *lsio-env
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT}/tautulli:/config
    ports: [127.0.0.1:8181:8181]
    healthcheck:
      <<: *healthcheck
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:8181/status]

  flaresolverr:
    <<: *common
    image: ghcr.io/flaresolverr/flaresolverr:latest@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    profiles: [flaresolverr]
    environment:
      TZ: ${TZ:-America/New_York}
    healthcheck:
      <<: *healthcheck
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:8191/health]

  recyclarr:
    <<: *common
    image: ghcr.io/recyclarr/recyclarr:8@sha256:3e9c41b9ec29bbf65fe846864058730d321a21f7695d8c0d9437b73e34d50ad9
    profiles: [recyclarr]
    user: ${PUID:-1000}:${PGID:-1000}
    environment:
      TZ: ${TZ:-America/New_York}
      CRON_SCHEDULE: "@daily"
    volumes:
      - ${APPDATA_ROOT:?Set APPDATA_ROOT}/recyclarr:/config

  unpackerr:
    <<: *common
    image: ghcr.io/unpackerr/unpackerr:latest@sha256:22b4693fbeaae4bd927905d63b59b8f67b4a1446682d965ac876c61a48976658
    profiles: [unpackerr]
    user: ${PUID:-1000}:${PGID:-1000}
    environment:
      TZ: ${TZ:-America/New_York}
      UN_SONARR_0_URL: http://sonarr:8989
      UN_SONARR_0_API_KEY: filepath:/run/secrets/sonarr_api_key
      UN_SONARR_0_PATHS_0: /data/torrents/tv
      UN_RADARR_0_URL: http://radarr:7878
      UN_RADARR_0_API_KEY: filepath:/run/secrets/radarr_api_key
      UN_RADARR_0_PATHS_0: /data/torrents/movies
    secrets: [sonarr_api_key, radarr_api_key]
    volumes:
      - ${DATA_ROOT:?Set DATA_ROOT}:/data

secrets:
  wireguard_private_key:
    file: ${HARBOR_ROOT:-.}/secrets/wireguard_private_key
  qbit_username:
    file: ${HARBOR_ROOT:-.}/secrets/qbit_username
  qbit_password:
    file: ${HARBOR_ROOT:-.}/secrets/qbit_password
  plex_claim:
    file: ${HARBOR_ROOT:-.}/secrets/plex_claim
  sonarr_api_key:
    file: ${HARBOR_ROOT:-.}/secrets/sonarr_api_key
  radarr_api_key:
    file: ${HARBOR_ROOT:-.}/secrets/radarr_api_key

volumes:
  forwarded:
